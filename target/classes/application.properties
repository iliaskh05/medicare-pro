server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/medicare_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Casablanca
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.fail-on-missing-locations=true
spring.flyway.table=flyway_schema_history

spring.jackson.time-zone=Africa/Casablanca
spring.jackson.serialization.write-dates-as-timestamps=false

radiocrm.jwt.secret=${RADIOCRM_JWT_SECRET:}
radiocrm.jwt.expiration-ms=${RADIOCRM_JWT_EXPIRATION_MS:86400000}
radiocrm.frontend-base-url=${RADIOCRM_FRONTEND_BASE_URL:http://localhost:8081}
radiocrm.cors.allowed-origins=${RADIOCRM_CORS_ORIGINS:http://localhost:8081,http://localhost:5173}
radiocrm.auth.public-register=${RADIOCRM_PUBLIC_REGISTER:false}
radiocrm.upload-dir=${RADIOCRM_UPLOAD_DIR:./data/uploads}
radiocrm.centre.nom=${RADIOCRM_CENTRE_NOM:Centre d'Imagerie Bentachfine}
radiocrm.centre.ville=${RADIOCRM_CENTRE_VILLE:Témara}
radiocrm.centre.adresse=${RADIOCRM_CENTRE_ADRESSE:}
radiocrm.centre.telephone=${RADIOCRM_CENTRE_TELEPHONE:}
radiocrm.centre.email=${RADIOCRM_CENTRE_EMAIL:}

# Assistant IA (Gemini) — clé uniquement côté serveur, jamais VITE_*
radiocrm.gemini.enabled=${GEMINI_ENABLED:true}
radiocrm.gemini.api-key=${GEMINI_API_KEY:}
radiocrm.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
radiocrm.gemini.api-base=${GEMINI_API_BASE:https://generativelanguage.googleapis.com/v1beta}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Mail health ne doit pas faire échouer le probe métier
management.health.mail.enabled=false
