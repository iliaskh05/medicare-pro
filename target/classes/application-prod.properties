spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
logging.level.com.crm.medicare=INFO
server.address=${SERVER_ADDRESS:0.0.0.0}
# Secrets obligatoires — pas de défaut. Le boot échoue s'ils manquent.
# RADIOCRM_JWT_SECRET, DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
radiocrm.jwt.secret=${RADIOCRM_JWT_SECRET}
radiocrm.cors.allowed-origins=${RADIOCRM_CORS_ORIGINS:}
radiocrm.cors.allow-private-lan=${RADIOCRM_CORS_ALLOW_PRIVATE_LAN:true}
radiocrm.auth.public-register=${RADIOCRM_PUBLIC_REGISTER:false}
